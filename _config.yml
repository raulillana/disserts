# GitHub Pages (Jekyll). El repo se lee igual en GitHub; esto solo afecta a la web.
title: Disertaciones · Disserts
description: Ensayos con tesis claras, datos comprobables y honestidad sobre sus límites.
author: Raul Illana
lang: es
url: "https://raulillana.github.io"
baseurl: "/disserts"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-default-layout
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: es
  # Portada y portadas por idioma. «ref» une las traducciones (botón ES/EN).
  - scope:
      path: "README.md"
    values:
      permalink: /
      ref: home
  - scope:
      path: "README.es.md"
    values:
      permalink: /es/
      ref: index
      lang: es
  - scope:
      path: "README.en.md"
    values:
      permalink: /en/
      ref: index
      lang: en
  # Disertación 0. Una carpeta por idioma: <categoría>/<ID>-<nombre-en-clave>/
  - scope:
      path: "IA/0-verano-de-silicio/Programadores con vacaciones de profesor.md"
    values:
      permalink: /IA/0-verano-de-silicio/
      ref: IA-0
      lang: es
      lectura: true
  - scope:
      path: "IA/0-verano-de-silicio/datos/FUENTES.md"
    values:
      permalink: /IA/0-verano-de-silicio/datos/fuentes/
      ref: IA-0-datos
      lang: es
  - scope:
      path: "IA/0-silicon-summer/Programmers Deserve Teachers' Holidays.md"
    values:
      permalink: /IA/0-silicon-summer/
      ref: IA-0
      lang: en
      lectura: true
  - scope:
      path: "IA/0-silicon-summer/data/SOURCES.md"
    values:
      permalink: /IA/0-silicon-summer/data/sources/
      ref: IA-0-datos
      lang: en

exclude:
  - "**/__pycache__"
  - Gemfile
  - Gemfile.lock
