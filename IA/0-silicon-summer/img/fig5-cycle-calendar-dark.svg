<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="t d" lang="en"><title id="t">Cycle calendar</title><desc id="d">Four phases in a 12-week cycle: plan and teach (3), run with agents (5), evaluate and consolidate (2), rest and renew (2).</desc><rect width="880" height="320" rx="8" fill="#1a1a19"/><g style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="40.0" y="34.0" fill="#f0efec" font-size="18" text-anchor="start" font-weight="650">A year in cycles: the school calendar of software</text><text x="40.0" y="58.0" fill="#c3c2b7" font-size="13.5" text-anchor="start" font-weight="400">Illustrative proposal: a repeating 12-week cycle. On-call covers critical services only</text><rect x="41.0" y="96" width="198.0" height="46" rx="4" fill="#3987e5"/><text x="140.0" y="124.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="650">3 wks</text><text x="46.0" y="164.0" fill="#f0efec" font-size="13" text-anchor="start" font-weight="600">Plan and teach</text><text x="46.0" y="182.0" fill="#c3c2b7" font-size="11.5" text-anchor="start" font-weight="400">goals and criteria</text><text x="46.0" y="198.0" fill="#c3c2b7" font-size="11.5" text-anchor="start" font-weight="400">acceptance tests</text><rect x="241.0" y="96" width="331.3" height="46" rx="4" fill="#d95926"/><text x="406.7" y="124.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="650">5 wks</text><text x="246.0" y="164.0" fill="#f0efec" font-size="13" text-anchor="start" font-weight="600">Run with agents</text><text x="246.0" y="182.0" fill="#c3c2b7" font-size="11.5" text-anchor="start" font-weight="400">agents produce</text><text x="246.0" y="198.0" fill="#c3c2b7" font-size="11.5" text-anchor="start" font-weight="400">people decide and handle exceptions</text><rect x="574.3" y="96" width="131.3" height="46" rx="4" fill="#199e70"/><text x="640.0" y="124.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="650">2 wks</text><text x="579.3" y="164.0" fill="#f0efec" font-size="13" text-anchor="start" font-weight="600">Evaluate</text><text x="579.3" y="182.0" fill="#c3c2b7" font-size="11.5" text-anchor="start" font-weight="400">full test runs</text><text x="579.3" y="198.0" fill="#c3c2b7" font-size="11.5" text-anchor="start" font-weight="400">every failure, a rule</text><rect x="707.7" y="96" width="131.3" height="46" rx="4" fill="#c98500"/><text x="773.3" y="124.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="650">2 wks</text><text x="712.7" y="164.0" fill="#f0efec" font-size="13" text-anchor="start" font-weight="600">Rest</text><text x="712.7" y="182.0" fill="#c3c2b7" font-size="11.5" text-anchor="start" font-weight="400">training</text><text x="712.7" y="198.0" fill="#c3c2b7" font-size="11.5" text-anchor="start" font-weight="400">on call for critical systems only</text><rect x="40" y="264" width="800" height="8" rx="4" fill="#2c2c2a"/><text x="40.0" y="290.0" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">Service continuity: systems keep running all 12 weeks, with automatic rollback and an independent reviewer</text></g></svg>