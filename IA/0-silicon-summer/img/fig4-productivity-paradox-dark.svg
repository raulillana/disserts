<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d" lang="en"><title id="t">The AI productivity paradox</title><desc id="d">Horizontal bars: tasks completed +21%, PRs merged +98%, review time +91%, PR size +154%, bugs per developer +9%.</desc><rect width="880" height="360" rx="8" fill="#1a1a19"/><g style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="24.0" y="34.0" fill="#f0efec" font-size="18" text-anchor="start" font-weight="650">Nearly twice the PRs. Nearly twice the review time</text><text x="24.0" y="58.0" fill="#c3c2b7" font-size="13.5" text-anchor="start" font-weight="400">Teams with high versus low AI adoption. Change in %, Faros AI 2025 (10,000+ developers, 1,255 teams)</text><rect x="24" y="74" width="14" height="10" rx="2" fill="#3987e5"/><text x="44.0" y="83.0" fill="#c3c2b7" font-size="12.5" text-anchor="start" font-weight="400">Output</text><rect x="114" y="74" width="14" height="10" rx="2" fill="#d95926"/><text x="134.0" y="83.0" fill="#c3c2b7" font-size="12.5" text-anchor="start" font-weight="400">Review load and quality</text><line x1="300.0" x2="300.0" y1="106" y2="312" stroke="#2c2c2a"/><text x="300.0" y="330.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">0</text><line x1="443.8" x2="443.8" y1="106" y2="312" stroke="#2c2c2a"/><text x="443.8" y="330.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">+50%</text><line x1="587.5" x2="587.5" y1="106" y2="312" stroke="#2c2c2a"/><text x="587.5" y="330.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">+100%</text><line x1="731.2" x2="731.2" y1="106" y2="312" stroke="#2c2c2a"/><text x="731.2" y="330.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">+150%</text><text x="288.0" y="136.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">Tasks completed per developer</text><path d="M300,122.0 h56.4 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-56.4 z" fill="#3987e5"/><text x="366.4" y="136.0" fill="#f0efec" font-size="12.5" text-anchor="start" font-weight="400">+21%</text><text x="288.0" y="176.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">Pull requests merged</text><path d="M300,162.0 h277.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-277.8 z" fill="#3987e5"/><text x="587.8" y="176.0" fill="#f0efec" font-size="12.5" text-anchor="start" font-weight="400">+98%</text><text x="288.0" y="216.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">Review time per PR</text><path d="M300,202.0 h257.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-257.6 z" fill="#d95926"/><text x="567.6" y="216.0" fill="#f0efec" font-size="12.5" text-anchor="start" font-weight="400">+91%</text><text x="288.0" y="256.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">Average PR size</text><path d="M300,242.0 h438.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-438.8 z" fill="#d95926"/><text x="748.8" y="256.0" fill="#f0efec" font-size="12.5" text-anchor="start" font-weight="400">+154%</text><text x="288.0" y="296.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">Bugs per developer</text><path d="M300,282.0 h21.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-21.9 z" fill="#d95926"/><text x="331.9" y="296.0" fill="#f0efec" font-size="12.5" text-anchor="start" font-weight="400">+9%</text><text x="24.0" y="348.0" fill="#898781" font-size="11" text-anchor="start" font-weight="400">Source: Faros AI, “The AI Productivity Paradox” (July 2025). Correlational telemetry data; no measurable gain company-wide</text></g></svg>