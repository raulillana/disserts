<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d" lang="es"><title id="t">Horas reales en 2023 frente a horas suficientes para la producción de 1950</title><desc id="d">Barras pareadas por país. Con la productividad de 2023, igualar la producción por trabajador de 1950 requeriría entre 159 y 522 horas al año, frente a entre 1.335 y 1.789 horas trabajadas.</desc><rect width="880" height="360" rx="8" fill="#1a1a19"/><g style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="24.0" y="34.0" fill="#f0efec" font-size="18" text-anchor="start" font-weight="650">Con la productividad de hoy, lo que se producía en 1950 cabría en 3–10 horas a la semana</text><text x="24.0" y="58.0" fill="#c3c2b7" font-size="13.5" text-anchor="start" font-weight="400">Horas al año por trabajador en 2023 frente a las necesarias para igualar la producción por trabajador de 1950</text><rect x="120" y="76" width="14" height="10" rx="2" fill="#d95926"/><text x="140.0" y="85.0" fill="#c3c2b7" font-size="12.5" text-anchor="start" font-weight="400">Horas trabajadas en 2023</text><rect x="336" y="76" width="14" height="10" rx="2" fill="#3987e5"/><text x="356.0" y="85.0" fill="#c3c2b7" font-size="12.5" text-anchor="start" font-weight="400">Horas que bastarían con la productividad de 2023</text><line x1="120.0" x2="120.0" y1="104" y2="310" stroke="#2c2c2a"/><text x="120.0" y="328.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">0</text><line x1="226.7" x2="226.7" y1="104" y2="310" stroke="#2c2c2a"/><text x="226.7" y="328.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">300</text><line x1="333.3" x2="333.3" y1="104" y2="310" stroke="#2c2c2a"/><text x="333.3" y="328.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">600</text><line x1="440.0" x2="440.0" y1="104" y2="310" stroke="#2c2c2a"/><text x="440.0" y="328.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">900</text><line x1="546.7" x2="546.7" y1="104" y2="310" stroke="#2c2c2a"/><text x="546.7" y="328.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">1.200</text><line x1="653.3" x2="653.3" y1="104" y2="310" stroke="#2c2c2a"/><text x="653.3" y="328.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">1.500</text><line x1="760.0" x2="760.0" y1="104" y2="310" stroke="#2c2c2a"/><text x="760.0" y="328.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">1.800</text><text x="108.0" y="126.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">Alemania</text><path d="M120,110 h471.8 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-471.8 z" fill="#d95926"/><text x="600.8" y="120.5" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">1.335 h</text><path d="M120,125 h53.5 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-53.5 z" fill="#3987e5"/><text x="182.5" y="135.5" fill="#f0efec" font-size="12" text-anchor="start" font-weight="400">159 h (≈ 3,2 h/semana)</text><text x="108.0" y="166.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">España</text><path d="M120,150 h579.4 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-579.4 z" fill="#d95926"/><text x="708.4" y="160.5" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">1.638 h</text><path d="M120,165 h54.6 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-54.6 z" fill="#3987e5"/><text x="183.6" y="175.5" fill="#f0efec" font-size="12" text-anchor="start" font-weight="400">162 h (≈ 3,2 h/semana)</text><text x="108.0" y="206.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">Francia</text><path d="M120,190 h525.7 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-525.7 z" fill="#d95926"/><text x="654.7" y="200.5" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">1.487 h</text><path d="M120,205 h80.8 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-80.8 z" fill="#3987e5"/><text x="209.8" y="215.5" fill="#f0efec" font-size="12" text-anchor="start" font-weight="400">236 h (≈ 4,7 h/semana)</text><text x="108.0" y="246.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">Reino Unido</text><path d="M120,230 h538.4 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-538.4 z" fill="#d95926"/><text x="667.4" y="240.5" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">1.523 h</text><path d="M120,245 h128.0 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-128.0 z" fill="#3987e5"/><text x="257.0" y="255.5" fill="#f0efec" font-size="12" text-anchor="start" font-weight="400">368 h (≈ 7,4 h/semana)</text><text x="108.0" y="286.0" fill="#f0efec" font-size="13" text-anchor="end" font-weight="400">EE. UU.</text><path d="M120,270 h633.0 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-633.0 z" fill="#d95926"/><text x="762.0" y="280.5" fill="#c3c2b7" font-size="12" text-anchor="start" font-weight="400">1.789 h</text><path d="M120,285 h182.8 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-182.8 z" fill="#3987e5"/><text x="311.8" y="295.5" fill="#f0efec" font-size="12" text-anchor="start" font-weight="400">522 h (≈ 10,4 h/semana)</text><text x="868.0" y="346.0" fill="#898781" font-size="11" text-anchor="end" font-weight="400">Cálculo propio: horas de 1950 ÷ multiplicador de productividad por hora 1950–2023. 50 semanas/año. Fuente: PWT 11.0 vía OWID</text></g></svg>