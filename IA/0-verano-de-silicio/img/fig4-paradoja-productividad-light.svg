<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d" lang="es"><title id="t">La paradoja de la productividad con IA</title><desc id="d">Barras horizontales: tareas completadas +21 %, PR fusionadas +98 %, tiempo de revisión +91 %, tamaño de PR +154 %, bugs por desarrollador +9 %.</desc><rect width="880" height="360" rx="8" fill="#fcfcfb"/><g style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="24.0" y="34.0" fill="#0b0b0b" font-size="18" text-anchor="start" font-weight="650">Casi el doble de PR. Casi el doble de tiempo de revisión</text><text x="24.0" y="58.0" fill="#52514e" font-size="13.5" text-anchor="start" font-weight="400">Equipos con mucha adopción de IA frente a poca. Cambio en %, Faros AI 2025 (10.000+ desarrolladores, 1.255 equipos)</text><rect x="24" y="74" width="14" height="10" rx="2" fill="#2a78d6"/><text x="44.0" y="83.0" fill="#52514e" font-size="12.5" text-anchor="start" font-weight="400">Producción</text><rect x="142" y="74" width="14" height="10" rx="2" fill="#eb6834"/><text x="162.0" y="83.0" fill="#52514e" font-size="12.5" text-anchor="start" font-weight="400">Carga de revisión y calidad</text><line x1="300.0" x2="300.0" y1="106" y2="312" stroke="#e1e0d9"/><text x="300.0" y="330.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">0</text><line x1="443.8" x2="443.8" y1="106" y2="312" stroke="#e1e0d9"/><text x="443.8" y="330.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">+50 %</text><line x1="587.5" x2="587.5" y1="106" y2="312" stroke="#e1e0d9"/><text x="587.5" y="330.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">+100 %</text><line x1="731.2" x2="731.2" y1="106" y2="312" stroke="#e1e0d9"/><text x="731.2" y="330.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">+150 %</text><text x="288.0" y="136.0" fill="#0b0b0b" font-size="13" text-anchor="end" font-weight="400">Tareas completadas por desarrollador</text><path d="M300,122.0 h56.4 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-56.4 z" fill="#2a78d6"/><text x="366.4" y="136.0" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="400">+21 %</text><text x="288.0" y="176.0" fill="#0b0b0b" font-size="13" text-anchor="end" font-weight="400">Pull requests fusionadas</text><path d="M300,162.0 h277.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-277.8 z" fill="#2a78d6"/><text x="587.8" y="176.0" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="400">+98 %</text><text x="288.0" y="216.0" fill="#0b0b0b" font-size="13" text-anchor="end" font-weight="400">Tiempo de revisión de cada PR</text><path d="M300,202.0 h257.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-257.6 z" fill="#eb6834"/><text x="567.6" y="216.0" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="400">+91 %</text><text x="288.0" y="256.0" fill="#0b0b0b" font-size="13" text-anchor="end" font-weight="400">Tamaño medio de cada PR</text><path d="M300,242.0 h438.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-438.8 z" fill="#eb6834"/><text x="748.8" y="256.0" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="400">+154 %</text><text x="288.0" y="296.0" fill="#0b0b0b" font-size="13" text-anchor="end" font-weight="400">Bugs por desarrollador</text><path d="M300,282.0 h21.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-21.9 z" fill="#eb6834"/><text x="331.9" y="296.0" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="400">+9 %</text><text x="24.0" y="348.0" fill="#898781" font-size="11" text-anchor="start" font-weight="400">Fuente: Faros AI, «The AI Productivity Paradox» (julio de 2025). Datos correlacionales de telemetría; sin mejora medible en el conjunto de la empresa</text></g></svg>