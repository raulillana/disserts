<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="t d" lang="es"><title id="t">Calendario por ciclos</title><desc id="d">Cuatro fases en un ciclo de 12 semanas: planificar y enseñar (3), ejecutar con agentes (5), evaluar y consolidar (2), descansar y renovarse (2).</desc><rect width="880" height="320" rx="8" fill="#fcfcfb"/><g style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="40.0" y="34.0" fill="#0b0b0b" font-size="18" text-anchor="start" font-weight="650">Un año por ciclos: el calendario escolar del software</text><text x="40.0" y="58.0" fill="#52514e" font-size="13.5" text-anchor="start" font-weight="400">Propuesta ilustrativa: un ciclo de 12 semanas que se repite. Las guardias cubren solo los servicios críticos</text><rect x="41.0" y="96" width="198.0" height="46" rx="4" fill="#2a78d6"/><text x="140.0" y="124.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="650">3 sem.</text><text x="46.0" y="164.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">Planificar y enseñar</text><text x="46.0" y="182.0" fill="#52514e" font-size="11.5" text-anchor="start" font-weight="400">objetivos y criterios</text><text x="46.0" y="198.0" fill="#52514e" font-size="11.5" text-anchor="start" font-weight="400">pruebas de aceptación</text><rect x="241.0" y="96" width="331.3" height="46" rx="4" fill="#eb6834"/><text x="406.7" y="124.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="650">5 sem.</text><text x="246.0" y="164.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">Ejecutar con agentes</text><text x="246.0" y="182.0" fill="#52514e" font-size="11.5" text-anchor="start" font-weight="400">los agentes producen</text><text x="246.0" y="198.0" fill="#52514e" font-size="11.5" text-anchor="start" font-weight="400">las personas deciden y resuelven excepciones</text><rect x="574.3" y="96" width="131.3" height="46" rx="4" fill="#1baf7a"/><text x="640.0" y="124.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="650">2 sem.</text><text x="579.3" y="164.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">Evaluar</text><text x="579.3" y="182.0" fill="#52514e" font-size="11.5" text-anchor="start" font-weight="400">pruebas completas</text><text x="579.3" y="198.0" fill="#52514e" font-size="11.5" text-anchor="start" font-weight="400">cada fallo, una regla</text><rect x="707.7" y="96" width="131.3" height="46" rx="4" fill="#eda100"/><text x="773.3" y="124.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="650">2 sem.</text><text x="712.7" y="164.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">Descansar</text><text x="712.7" y="182.0" fill="#52514e" font-size="11.5" text-anchor="start" font-weight="400">formación</text><text x="712.7" y="198.0" fill="#52514e" font-size="11.5" text-anchor="start" font-weight="400">sin guardia salvo lo crítico</text><rect x="40" y="264" width="800" height="8" rx="4" fill="#e1e0d9"/><text x="40.0" y="290.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">Continuidad del servicio: los sistemas siguen funcionando las 12 semanas, con vuelta atrás automática y un revisor independiente</text></g></svg>