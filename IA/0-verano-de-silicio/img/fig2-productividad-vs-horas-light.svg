<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="t d" lang="es"><title id="t">Productividad por hora frente a horas trabajadas, 1950–2023</title><desc id="d">Dos paneles de barras. Productividad por hora en 2023 respecto a 1950: Alemania ×15,3, España ×13,6, Francia ×10,0, Reino Unido ×5,5, EE. UU. ×3,9. Horas al año por trabajador: Alemania −45 %, Francia −36,7 %, España −25,7 %, Reino Unido −24,7 %, EE. UU. −11,5 %.</desc><rect width="880" height="380" rx="8" fill="#fcfcfb"/><g style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="24.0" y="34.0" fill="#0b0b0b" font-size="18" text-anchor="start" font-weight="650">Cada hora rinde de 4 a 15 veces más que en 1950; las horas bajaron un 12–45 %</text><text x="24.0" y="58.0" fill="#52514e" font-size="13.5" text-anchor="start" font-weight="400">Cambio entre 1950 y 2023. Productividad: PIB por hora trabajada, precios constantes</text><text x="120.0" y="84.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">Productividad por hora (veces)</text><text x="510.0" y="84.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">Horas al año por trabajador (%)</text><line x1="120.0" x2="120.0" y1="96" y2="316" stroke="#e1e0d9"/><text x="120.0" y="334.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">0</text><line x1="213.8" x2="213.8" y1="96" y2="316" stroke="#e1e0d9"/><text x="213.8" y="334.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">×5</text><line x1="307.5" x2="307.5" y1="96" y2="316" stroke="#e1e0d9"/><text x="307.5" y="334.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">×10</text><line x1="401.2" x2="401.2" y1="96" y2="316" stroke="#e1e0d9"/><text x="401.2" y="334.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">×15</text><line x1="510.0" x2="510.0" y1="96" y2="316" stroke="#e1e0d9"/><text